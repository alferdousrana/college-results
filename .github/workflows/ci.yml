name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Supply-chain guard (stops the build if the repository was tampered with)
        run: node scripts/guard.mjs
      - run: npm ci
      - run: npm run validate:flags
      - run: npm test
      - run: npm run build
